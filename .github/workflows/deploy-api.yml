name: Deploy API

# Only after CI went green on a push to main, and only once a reviewer approves the protected
# `production` environment: the AWS role trusts nothing but jobs running in that environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces one still waiting for approval, never one already deploying.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  # A push that leaves the deployed API as it was since the last successful run asks for no
  # approval: its tests and docs never reach AWS.
  changes:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-api.yml/runs?status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ "$MANUAL" = true ] || [ -z "$last" ] || ! git cat-file -e "$last^{commit}" 2>/dev/null \
            || [ -n "$(git diff --name-only "$last" HEAD -- api ':!api/test' ':!api/eval' ':!api/*.md')" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: api
    steps:
      # Pinned to commits: this job holds AWS credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      # No install scripts run next to the credentials; esbuild ships its binary as a package.
      - run: npm ci --ignore-scripts
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-2
      - run: npx cdk deploy EslojustoApi --require-approval never -c stripePriceId="$STRIPE_PRICE_ID" -c reserveConcurrency="$RESERVE_CONCURRENCY" -c alertEmail="$ALERT_EMAIL"
        env:
          STRIPE_PRICE_ID: ${{ vars.STRIPE_PRICE_ID }}
          RESERVE_CONCURRENCY: ${{ vars.RESERVE_CONCURRENCY || 'true' }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
