name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      # With /alquiler/ and /contrato/ in the build, so the copy test reads their pages too.
      - run: npm run build
        env: { PUBLIC_RENTAL: '1', PUBLIC_EMPLOYMENT: '1' }
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }
      - name: rtl layout (ar-test pseudo-locale)
        run: TEST_RTL=1 npm run build && TEST_RTL=1 npm run test:e2e -- --project=rtl
        env: { CI: 'true' }
      - name: analytics (test key, PostHog stubbed)
        run: npm run test:e2e -- --project=analytics
        env: { CI: 'true', TEST_ANALYTICS: '1' }
      - name: rental review (built with /alquiler/)
        run: npm run test:e2e -- --project=rental
        env: { CI: 'true', TEST_RENTAL: '1' }
      - name: employment contract review (built with /contrato/)
        run: npm run test:e2e -- --project=employment
        env: { CI: 'true', TEST_EMPLOYMENT: '1' }
      - name: documents (fake API origins, routed by the page)
        run: npm run test:e2e -- --project=documents
        env: { CI: 'true', TEST_DOCUMENTS: '1' }
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # Only what ships to the browser: a dev-only advisory can't reach a visitor.
      - run: npm audit --omit=dev --audit-level=high
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      # The deploy job's install path: no install scripts; esbuild ships its binary as a package.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:run
      - run: npm run synth
      # Only what ships in the Lambda bundles; the CDK toolchain never runs in production.
      - run: npm audit --omit=dev --audit-level=high
  all-green:
    name: all-green
    needs: [quality, audit, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
