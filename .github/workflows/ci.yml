name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  # A release-please PR that only bumps the version and the changelog runs nothing heavy: the
  # version is read nowhere, and main runs the whole pipeline again after the merge.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          release_only=false
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ] && [[ "$HEAD_REF" == release-please--* ]]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            other=$(printf '%s\n' "$files" | grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json|package-lock\.json' || true)
            # In the two package files, only "version" lines may change.
            changed=$(git diff -U0 "$BASE...$HEAD" -- package.json package-lock.json | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*"version": "[^"]+",?$' || true)
            if [ -z "$other" ] && [ -z "$changed" ]; then release_only=true; fi
          fi
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
          echo "release_only=$release_only"
  quality:
    name: quality
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # knip follows the imports into api/, so it needs that package's dependencies too.
      - run: npm ci --ignore-scripts
        working-directory: api
      - run: npm run knip
      - run: npm run type:check
      # The copy tests read the built pages.
      - run: npm run build
      - run: npm run test:run
  # One job per Playwright project: each needs its own build, and a failure reruns alone.
  e2e:
    name: e2e (${{ matrix.project }})
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop, switch: '' }
          - { project: mobile, switch: '' }
          # The ar-test pseudo-locale.
          - { project: rtl, switch: TEST_RTL }
          # A language served unpublished to its reviewer.
          - { project: review, switch: TEST_REVIEW }
          # A test key, PostHog stubbed.
          - { project: analytics, switch: TEST_ANALYTICS }
          - { project: rental, switch: TEST_RENTAL }
          - { project: employment, switch: TEST_EMPLOYMENT }
          - { project: erte, switch: TEST_ERTE }
          - { project: household, switch: TEST_HOUSEHOLD }
          - { project: insurance, switch: TEST_INSURANCE }
          - { project: credit, switch: TEST_CREDIT }
          - { project: mortgage, switch: TEST_MORTGAGE }
          - { project: bills, switch: TEST_BILLS }
          # Fake API origins, routed by the page.
          - { project: documents, switch: TEST_DOCUMENTS }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          if [ -n "$SWITCH" ]; then export "$SWITCH=1"; fi
          npm run test:e2e -- --project="$PROJECT"
        env: { CI: 'true', PROJECT: '${{ matrix.project }}', SWITCH: '${{ matrix.switch }}' }
  audit:
    name: audit
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # Only what ships to the browser: a dev-only advisory can't reach a visitor.
      - run: npm audit --omit=dev --audit-level=high
  api:
    name: api
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      # The deploy job's install path: no install scripts; esbuild ships its binary as a package.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:run
      - run: npm run synth
      # Only what ships in the Lambda bundles; the CDK toolchain never runs in production.
      - run: npm audit --omit=dev --audit-level=high
  all-green:
    name: all-green
    needs: [scope, quality, e2e, audit, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: >-
          needs.scope.result != 'success'
          || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (contains(needs.*.result, 'skipped') && needs.scope.outputs.release_only != 'true')
        run: exit 1
