name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }
jobs:
  # A release-please PR that only bumps the version and the changelog runs nothing heavy: the
  # version is read nowhere, and main runs the whole pipeline again after the merge.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      release_only: ${{ steps.check.outputs.release_only }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          release_only=false
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ] && [[ "$HEAD_REF" == release-please--* ]]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            other=$(printf '%s\n' "$files" | grep -vxE 'CHANGELOG\.md|\.release-please-manifest\.json|package\.json|package-lock\.json' || true)
            # In the two package files, only "version" lines may change.
            changed=$(git diff -U0 "$BASE...$HEAD" -- package.json package-lock.json | grep -E '^[+-][^+-]' | grep -vE '^[+-][[:space:]]*"version": "[^"]+",?$' || true)
            if [ -z "$other" ] && [ -z "$changed" ]; then release_only=true; fi
          fi
          echo "release_only=$release_only" >> "$GITHUB_OUTPUT"
          echo "release_only=$release_only"
  quality:
    name: quality
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      # With /alquiler/, /contrato/, /paro/erte/ and /empleada-de-hogar/ in the build, so the copy test reads their pages too.
      - run: npm run build
        env: { PUBLIC_RENTAL: '1', PUBLIC_EMPLOYMENT: '1', PUBLIC_ERTE: '1', PUBLIC_HOUSEHOLD: '1' }
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: 'true' }
      - name: rtl layout (ar-test pseudo-locale)
        run: TEST_RTL=1 npm run build && TEST_RTL=1 npm run test:e2e -- --project=rtl
        env: { CI: 'true' }
      - name: analytics (test key, PostHog stubbed)
        run: npm run test:e2e -- --project=analytics
        env: { CI: 'true', TEST_ANALYTICS: '1' }
      - name: rental review (built with /alquiler/)
        run: npm run test:e2e -- --project=rental
        env: { CI: 'true', TEST_RENTAL: '1' }
      - name: employment contract review (built with /contrato/)
        run: npm run test:e2e -- --project=employment
        env: { CI: 'true', TEST_EMPLOYMENT: '1' }
      - name: benefit during an ERTE (built with /paro/erte/)
        run: npm run test:e2e -- --project=erte
        env: { CI: 'true', TEST_ERTE: '1' }
      - name: household worker review (built with /empleada-de-hogar/)
        run: npm run test:e2e -- --project=household
        env: { CI: 'true', TEST_HOUSEHOLD: '1' }
      - name: documents (fake API origins, routed by the page)
        run: npm run test:e2e -- --project=documents
        env: { CI: 'true', TEST_DOCUMENTS: '1' }
  audit:
    name: audit
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # Only what ships to the browser: a dev-only advisory can't reach a visitor.
      - run: npm audit --omit=dev --audit-level=high
  api:
    name: api
    needs: scope
    if: needs.scope.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      # The deploy job's install path: no install scripts; esbuild ships its binary as a package.
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type:check
      - run: npm run test:run
      - run: npm run synth
      # Only what ships in the Lambda bundles; the CDK toolchain never runs in production.
      - run: npm audit --omit=dev --audit-level=high
  all-green:
    name: all-green
    needs: [scope, quality, audit, api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every required job must have succeeded
        if: >-
          needs.scope.result != 'success'
          || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          || (contains(needs.*.result, 'skipped') && needs.scope.outputs.release_only != 'true')
        run: exit 1
